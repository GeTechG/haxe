name: Binaries
on:
  push:
    branches: [development]
  # Build any other commit on demand (pick the branch in "Run workflow").
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: a push that keeps the build key waits for the build in flight, then finds its file.
concurrency: binaries

jobs:
  linux64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build key is found in the history

      # The build key: the last commit that touches code (a path outside .github/infra-paths) or the build
      # recipe. Consumers compute it by the same rule to find the file, so an infrastructure push builds nothing.
      - name: Find the build key, skip when it already has a build
        id: key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t infra < <(sed -e '/^#/d' -e '/^$/d' -e '/^extra\/build-linux\.sh$/d' \
            -e 's/^/:(top,exclude,literal)/' .github/infra-paths)
          key=$(git log -1 --format=%H HEAD -- . "${infra[@]}")
          [ -n "$key" ] || { echo "::error::no code commit in the history of $GITHUB_SHA"; exit 1; }
          echo "build key $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          if gh release view builds --json assets -q '.assets[].name' 2>/dev/null | grep -qx "haxe-linux64-$key.tar.gz"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      # `haxe -version` embeds `git rev-parse --short HEAD`: build the key commit, with the abbreviation
      # pinned to the length a local build of the key reports.
      - name: Check out the build key
        if: steps.key.outputs.found != 'true'
        run: |
          git config core.abbrev 7
          git checkout -q --detach "${{ steps.key.outputs.key }}"

      - name: Cache opam
        if: steps.key.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ runner.os }}-${{ runner.arch }}-opam-${{ hashFiles('haxe.opam', 'extra/build-linux.sh') }}

      - name: Install dependencies
        if: steps.key.outputs.found != 'true'
        run: |
          sudo apt-get update -qqy
          sudo apt-get install -qqy opam libpcre2-dev zlib1g-dev libmbedtls-dev

      - name: Build
        if: steps.key.outputs.found != 'true'
        run: extra/build-linux.sh

      # One release for all builds, one file per build key; its single tag follows the latest build.
      # No --clobber: consumers pin the checksum of a published file, and a rebuild would change it.
      - name: Publish the build of the key
        if: steps.key.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          asset="out/haxe-linux64-$KEY.tar.gz"
          mv out/haxe-linux64.tar.gz "$asset"
          git push -f origin "$KEY:refs/tags/builds"
          gh release view builds >/dev/null 2>&1 || gh release create builds --verify-tag \
            --title "Compiler builds" --notes "Linux x86_64 builds, one file per build key: haxe-linux64-<key>.tar.gz"
          gh release upload builds "$asset"
