name: Binaries
on:
  push:
    branches: [development]
    # Infrastructure-only pushes do not change the compiler: no build.
    paths-ignore:
      - AGENTS.md
      - 'openspec/**'
      - .github/infra-paths
      - '.github/scripts/**'
      - .github/workflows/ci.yml
      - '.agents/**'
      - '.claude/**'
      - skills-lock.json
  # Build any other commit on demand (pick the branch in "Run workflow").
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Skip when this commit already has a build
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view builds --json assets -q '.assets[].name' 2>/dev/null | grep -qx "haxe-linux64-$GITHUB_SHA.tar.gz"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache opam
        if: steps.existing.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
            _opam
          key: ${{ runner.os }}-${{ runner.arch }}-opam-${{ hashFiles('haxe.opam', 'extra/build-linux.sh') }}

      - name: Install dependencies
        if: steps.existing.outputs.found != 'true'
        run: |
          sudo apt-get update -qqy
          sudo apt-get install -qqy opam libpcre2-dev zlib1g-dev libmbedtls-dev

      - name: Build
        if: steps.existing.outputs.found != 'true'
        run: extra/build-linux.sh

      # One release for all builds, one file per commit; its single tag follows the latest build.
      - name: Publish the build of this commit
        if: steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="out/haxe-linux64-$GITHUB_SHA.tar.gz"
          mv out/haxe-linux64.tar.gz "$asset"
          git push -f origin "$GITHUB_SHA:refs/tags/builds"
          gh release view builds >/dev/null 2>&1 || gh release create builds --verify-tag \
            --title "Compiler builds" --notes "Linux x86_64 builds, one file per commit: haxe-linux64-<sha>.tar.gz"
          gh release upload builds "$asset" --clobber
