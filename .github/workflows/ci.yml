name: CI

on:
  push:
    branches: [development]
  pull_request:

jobs:
  commit-kinds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test of the check
        run: bash .github/scripts/check-commit-kinds-test.sh
      - name: Commits do not mix code and infrastructure
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}^..${{ github.sha }}"
          fi
          bash .github/scripts/check-commit-kinds.sh "$range"

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: OpenSpec is valid at the pinned version
        env:
          OPENSPEC_TELEMETRY: "0"
        run: |
          pin=$(tr -d '[:space:]' < openspec/cli.pin)
          openspec() { npm exec --yes --package="@fission-ai/openspec@$pin" -- openspec "$@"; }
          fail=0
          [ "$(openspec --version)" = "$pin" ] || { echo "::error::openspec --version is not $pin"; fail=1; }

          # Specs and active changes, warnings included.
          openspec validate --all --strict --no-interactive || fail=1

          # A main spec has a real Purpose.
          for f in openspec/specs/*/spec.md; do
            if awk '/^## Purpose/{p=1;next} p&&NF{print;exit}' "$f" | grep -q '^TBD - created by archiving change'; then
              echo "::error file=$f::Purpose is the TBD placeholder"; fail=1
            fi
          done

          # An active change is created by the CLI.
          for d in openspec/changes/*/; do
            [ "$d" = openspec/changes/archive/ ] && continue
            [ -f "$d.openspec.yaml" ] || { echo "::error file=$d::active change has no .openspec.yaml"; fail=1; }
          done

          # The skills are generated by the pinned version.
          for dir in .claude/skills .agents/skills; do
            set -- "$dir"/openspec-*/SKILL.md
            [ -f "$1" ] || { echo "::error::$dir holds no openspec-* skill"; fail=1; continue; }
            for f in "$@"; do
              v=$(sed -n 's/^ *generatedBy: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' "$f")
              [ "$v" = "$pin" ] || { echo "::error file=$f::generatedBy '$v' is not the pin $pin"; fail=1; }
            done
          done

          # An archived change leaves no open task but a human one.
          if open=$(grep -rnE '^\s*- \[ \]' --include=tasks.md openspec/changes/archive | grep -v '\[human\]'); then
            echo "$open" | sed 's/^/::error::open task in an archived change: /'; fail=1
          fi

          exit $fail
